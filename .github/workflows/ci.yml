# CI -- the fast gates on every push and every pull request.
#
# NOT the .phpt grid. The grid is 21395 tests, takes about half an hour and
# needs php-src cloned; it is the number this project answers with, measured by
# hand and recorded in the README with its date. What runs here is the gates
# that catch a regression in minutes: see tests/run.sh, which since the
# extension branch also runs tests/ext.sh -- a .php compiled into a .so, loaded
# by the runner's own php, and compared with what that php gives for the same
# source interpreted.
#
# Three legs, one per host that has been RUN: macOS arm64 builds and grades
# itself; the two Linux compilers are CROSS-BUILT on the same macOS runner and
# then each is graded on a Linux runner of its own architecture, by
# tests/linux.sh, against a php 8.5 on that host.
#
# And two Windows legs, which are NOT cross-built: mc-php does not cross-compile
# across operating systems, so each Windows compiler is built ON its runner by
# that runner's own mc.exe (the object + lld-link road, docs/plan.md § 5) and
# graded there by tests/windows.sh -- the fixture gate and the extension gate,
# against a php 8.5 of that host.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain is a PUBLISHED mc release, never mc built from source: this
  # repository is a CONSUMER of mc's 1.0 frozen surface and it should break the
  # way a consumer breaks. mc.toml's [package].mc says 1.1.0 is the floor;
  # this is what is actually installed, and the Windows legs were measured on
  # it (docs/plan.md § 5).
  MC_VERSION: "1.3.0"
  # 8.5 because the oracle is php-src at tag php-8.5.10 and every fixture is
  # BYTE FOR BYTE what php prints. The minor is pinned; the patch is not, so a
  # diagnostic reworded in an 8.5.x can fail a fixture -- that is the gate
  # working, and the fix is to re-measure, never to loosen the comparison.
  PHP_VERSION: "8.5"

jobs:
  check:
    name: The fast gates (macos/arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install mc ${{ env.MC_VERSION }}
        run: |
          set -eu
          asset="mc-$MC_VERSION-macos-arm64.tar.gz"
          base="https://github.com/minicompiler/mc/releases/download/v$MC_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/$asset"        "$base/$asset"
          curl -fsSL -o "$RUNNER_TEMP/$asset.sha256" "$base/$asset.sha256"
          # the release publishes the digest beside the archive; unpack only
          # after it matches, which is mc's own rule for its own installs
          ( cd "$RUNNER_TEMP" && shasum -a 256 -c "$asset.sha256" )
          mkdir -p "$RUNNER_TEMP/mc"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/mc" --strip-components=1
          # the binary AND the lib/mc/v<ver>/ tree beside it: since mc's M52
          # the standard library is a tree next to the executable, not a blob
          # inside it, and `mc` finds it by its own path
          echo "$RUNNER_TEMP/mc" >> "$GITHUB_PATH"

      - name: Install PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Versions
        run: |
          mc --version
          php --version | head -1
          # The four values examples/hello/mcphp.toml states. tests/ext.sh
          # compares them against this php and names the file if they differ:
          # a module header that disagrees with its target is refused by the
          # loader with `Unable to initialize module` and nothing else.
          php -i | grep -E '^(PHP API|PHP Extension Build|Thread Safety|Debug Build) '
          # For tests/ext.sh step 1 (the layout gate against the installed php
          # headers) and step 5 (the C reference behind errors.expect). Both
          # self-skip where they are absent -- the COMPILER needs neither, and
          # that is the claim, so the runner is where they are checked.
          php-config --includes || echo "  no php-config: the layout gate will skip"
          cc --version | head -1 || echo "  no cc: the layout gate will skip"

      - name: Build
        run: mc build

      - name: Install mc's library tree where any mc-php can find it
        run: |
          set -eu
          # To BUILD mc-php, not to run it. src/mc-php.mc includes <float> and
          # the two float machines, and since mc's M52 those are LIBRARY names
          # resolved out of a tree beside `mc`, not out of its blob.
          #
          # It used to be needed to RUN it as well: lib/php_rt.mc opened with
          # `#include <sys>`, so every program mc-php compiled needed the tree
          # too. Since the hosts branch the runtime declares its own system
          # calls (lib/rt_host_*.mc) and a released mc-php needs nothing
          # installed beside it -- which is what makes a one-binary archive
          # honest on every host.
          #
          # $HOME/.mc/libs and not beside the binary: tests/fixtures.sh takes a
          # SNAPSHOT of the compiler into a temporary directory before it
          # grades anything, and a snapshot has no tree beside it. The HOME
          # root is the one that survives being copied, which is why it is the
          # one `mc install` writes.
          #
          # The tree comes out of the tarball already downloaded and verified,
          # so this needs no network and no registry.
          mkdir -p "$HOME/.mc/libs"
          cp -R "$RUNNER_TEMP/mc/lib/mc" "$HOME/.mc/libs/mc"
          ls -d "$HOME/.mc/libs/mc/"*

      - name: The fast gates
        run: sh tests/run.sh

      - name: Cross-build the two Linux compilers
        run: |
          set -eu
          # No linker and no sysroot: mc writes the ELF itself (its M42). The
          # ENTRY names the host layer, because `#include <mc/host>` resolves
          # to the host of the compiler doing the build -- through it this
          # runner's macOS layer went into a Linux binary, which linked and
          # then would not load (`_NSGetEnviron: symbol not found`).
          mc build src --config src/mc-php.linux-aarch64.toml
          mc build src --config src/mc-php.linux-x86_64.toml
          file build/mc-php-linux-arm64 build/mc-php-linux-x86_64

      - name: Upload them for the Linux legs
        uses: actions/upload-artifact@v4
        with:
          name: mc-php-linux
          path: |
            build/mc-php-linux-arm64
            build/mc-php-linux-x86_64
          if-no-files-found: error

  # The Linux compilers are graded by RUNNING them: tests/linux.sh compiles
  # every fixture with the cross-built binary inside a container that has php
  # 8.5 of its own, and compares both streams and the exit code -- the same
  # gate the macOS leg runs, on the host the binary is for. A `file` output is
  # not a proof and this job is what replaces one. Since the extension branch
  # it also builds examples/hello into a .so with ld.lld and loads it there,
  # which is the only place the ELF half of the extension road is executed.
  linux:
    name: The fixture gate (linux/${{ matrix.arch }})
    needs: [check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: ubuntu-24.04-arm }
          - { arch: x86_64,  runner: ubuntu-24.04 }
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the cross-built compilers
        uses: actions/download-artifact@v4
        with:
          name: mc-php-linux
          path: build

      - name: It loads, it compiles, the fixtures agree, and the extension loads
        run: |
          set -eu
          chmod +x build/mc-php-linux-*
          # tests/linux.sh ends with tests/ext.sh: the .so is built by the
          # cross-built compiler and loaded by the php IN THE CONTAINER, so
          # the module header is graded against the php it is for.
          sh tests/linux.sh ${{ matrix.arch }}

  # Built ON Windows and graded there. The compiler is mc-php's own source,
  # compiled by the runner's mc.exe and linked by lld-link next to the three
  # files tests/winsys.sh writes (two import libraries' worth of names and two
  # mc objects) -- nothing comes from the macOS job. tests/windows.sh then runs
  # the same fixture gate as the other hosts and the extension gate with a DLL
  # the runner's php loads.
  windows:
    name: The fixture gate (windows/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  nick: x86_64, runner: windows-latest }
          - { arch: aarch64, nick: arm64,  runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    env:
      # MSYS rewrites an argument that looks like a path, and every dash-form
      # lld-link option does (mc's own Windows legs set the same).
      MSYS2_ARG_CONV_EXCL: "*"
    steps:
      # Before the checkout: a fixture is compared byte for byte with php, and
      # a CRLF checkout changes what a heredoc prints. .gitattributes says so
      # too; this covers the checkout made before that file is read.
      - name: Never translate line endings
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v4

      - name: Install mc ${{ env.MC_VERSION }} (the Windows build)
        run: |
          set -eu
          asset="mc-$MC_VERSION-windows-${{ matrix.nick }}.tar.gz"
          base="https://github.com/minicompiler/mc/releases/download/v$MC_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$asset"        "$base/$asset"
          curl -fsSL -o "$asset.sha256" "$base/$asset.sha256"
          sha256sum -c "$asset.sha256"
          mkdir -p mc
          tar -xzf "$asset" -C mc --strip-components=1
          ls mc
          cygpath -w "$RUNNER_TEMP/mc" >> "$GITHUB_PATH"

      # lld-link is the only LLVM tool used: it writes the import libraries
      # (`-lib -def:`) as well as linking.
      - name: lld-link
        run: |
          set -eu
          if command -v lld-link >/dev/null 2>&1; then :
          elif [ -x "/c/Program Files/LLVM/bin/lld-link.exe" ]; then
            printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          else
            # No download: an unverified toolchain put on PATH would run as
            # the linker of a release. Both images carry LLVM today (measured:
            # C:\Program Files\LLVM on windows-latest and windows-11-arm);
            # an image that stops carrying it fails here, by name.
            printf '%s\n' '::error::lld-link is not on this runner (looked on PATH and in C:\Program Files\LLVM\bin)'
            exit 1
          fi

      - name: Install PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Versions
        run: |
          uname -srm
          mc --version
          mc --host
          lld-link --version
          php --version | head -1
          php -r 'echo php_uname("m"), " ", PHP_INT_SIZE, "\n";'
          php -i | tr -d '\r' | grep -E '^(PHP API|PHP Extension Build|Thread Safety|Debug Build) '
          # The names src/win/php8.def says php's DLL exports, read out of the
          # DLL itself: a wrong one is a module php refuses to load with
          # "The specified procedure could not be found" and nothing else.
          # (Windows form: MSYS2_ARG_CONV_EXCL keeps /c/tools/... from being
          # translated, and llvm-readobj is a native program)
          pdir=$(cygpath -m "$(dirname "$(command -v php)")")
          for d in php8.dll php8ts.dll; do
            [ -f "$pdir/$d" ] || continue
            echo "$d:"
            llvm-readobj --coff-exports "$pdir/$d" | tr -d '\r' \
              | grep -E 'Name: (_emalloc|zend_type_error|zend_argument_count_error|zend_throw_exception|zend_lookup_class)(@|$)' \
              || echo "  (llvm-readobj could not say)"
          done

      - name: Build mc-php here
        run: |
          set -eu
          sh tests/winsys.sh ${{ matrix.arch }}
          [ "${{ matrix.arch }}" = x86_64 ] || sh tests/winsys.sh x86_64
          mc build src --config src/mc-php.windows-${{ matrix.arch }}.toml
          ls -l build/mc-php-windows-${{ matrix.arch }}.exe
          build/mc-php-windows-${{ matrix.arch }}.exe --host

      - name: It compiles, the fixtures agree, and the extension loads
        run: |
          # The native programs open temporary files by the path the shell
          # hands them; MSYS's /tmp means nothing to them, the runner's temp
          # in D:/a/_temp form means the same thing to both.
          TMPDIR=$(cygpath -m "$RUNNER_TEMP")
          export TMPDIR
          sh tests/windows.sh ${{ matrix.arch }}
