# Release -- build the compiler for the hosts CI can produce, and publish it.
#
# Started by autotag.yml with the tag it just pushed, or by hand from the
# Actions tab. The shape is mc's release.yml: the tag's annotation becomes the
# release body, every archive carries a .sha256 beside it, and `publish` needs
# every producer so a half-built release is never published.
#
# THREE archives, and each one is a target that has been RUN. macOS arm64 is
# built and graded on the runner; the two Linux compilers are CROSS-BUILT on
# the same macOS runner -- mc writes a dynamic ELF64 itself, no linker and no
# sysroot -- and then each is graded on a Linux runner of its own architecture,
# by tests/linux.sh, against a php 8.5 of that host. A row is here because
# something ran it, never because it linked.
#
# Windows is NOT here and the README says why on its own row: the compiler
# needs mc's object + lld-link road there (a single translation unit cannot
# carry both <mc/host_windows> and <sys_windows> -- they both define O_CREAT),
# and the runtime needs a kernel32 layer that does not exist yet.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, e.g. v0.1.0"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  MC_VERSION: "1.1.0"
  PHP_VERSION: "8.5"

jobs:
  build:
    name: Build (macos/arm64 + the two Linux cross-builds)
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0     # the annotation is the release body

      - name: The version
        id: ver
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$TAG" in v*) : ;; *) echo "::error::$TAG is not a v* tag"; exit 1 ;; esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install mc ${{ env.MC_VERSION }}
        run: |
          set -eu
          asset="mc-$MC_VERSION-macos-arm64.tar.gz"
          base="https://github.com/minicompiler/mc/releases/download/v$MC_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/$asset"        "$base/$asset"
          curl -fsSL -o "$RUNNER_TEMP/$asset.sha256" "$base/$asset.sha256"
          ( cd "$RUNNER_TEMP" && shasum -a 256 -c "$asset.sha256" )
          mkdir -p "$RUNNER_TEMP/mc"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/mc" --strip-components=1
          echo "$RUNNER_TEMP/mc" >> "$GITHUB_PATH"

      - name: Install PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Build
        run: |
          mc --version
          mc build
          ls -l build/mc-php

      - name: Install mc's library tree where any mc-php can find it
        run: |
          set -eu
          # To BUILD mc-php, not to run it. src/mc-php.mc includes <float> and
          # the two float machines, and since mc's M52 those are LIBRARY names
          # resolved out of a tree beside `mc`, not out of its blob.
          #
          # It used to be needed to RUN it as well: lib/php_rt.mc opened with
          # `#include <sys>`, so every program mc-php compiled needed the tree
          # too. Since the hosts branch the runtime declares its own system
          # calls (lib/rt_host_*.mc) and a released mc-php needs nothing
          # installed beside it -- which is what makes a one-binary archive
          # honest on every host.
          #
          # $HOME/.mc/libs and not beside the binary: tests/fixtures.sh takes a
          # SNAPSHOT of the compiler into a temporary directory before it
          # grades anything, and a snapshot has no tree beside it. The HOME
          # root is the one that survives being copied, which is why it is the
          # one `mc install` writes.
          #
          # The tree comes out of the tarball already downloaded and verified,
          # so this needs no network and no registry.
          mkdir -p "$HOME/.mc/libs"
          cp -R "$RUNNER_TEMP/mc/lib/mc" "$HOME/.mc/libs/mc"
          ls -d "$HOME/.mc/libs/mc/"*

      # A release is not published on a compiler that has not been graded.
      # This is the same tests/run.sh CI runs on every pull request.
      - name: The fast gates
        run: sh tests/run.sh

      - name: Package (macos/arm64)
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          name="mc-php-$VERSION-macos-arm64"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"
          cp build/mc-php "$stage/mc-php"
          cp README.md LICENSE "$stage/" 2>/dev/null || cp README.md "$stage/"
          # What a user needs beside the binary, and nothing else: the runtime
          # is INSIDE it (#embed), so there is no lib/ to ship.
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -l dist

      - name: Cross-build the two Linux compilers
        run: |
          set -eu
          # No linker and no sysroot: `os = "linux"` has a direct-executable
          # backend (mc's M42), so `mc build` writes the ELF itself. The entry
          # names the host layer -- `#include <mc/host>` would bake this
          # runner's macOS one into a Linux binary, which is what the branch
          # started from (`_NSGetEnviron: symbol not found`).
          mc build src --config src/mc-php.linux-aarch64.toml
          mc build src --config src/mc-php.linux-x86_64.toml
          file build/mc-php-linux-arm64 build/mc-php-linux-x86_64

      - name: Package
        id: pkg2
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          for pair in "linux-arm64:build/mc-php-linux-arm64" "linux-x86_64:build/mc-php-linux-x86_64"; do
            slug=${pair%%:*}; bin=${pair#*:}
            name="mc-php-$VERSION-$slug"
            stage="$RUNNER_TEMP/$name"
            mkdir -p "$stage"
            cp "$bin" "$stage/mc-php"
            cp README.md LICENSE "$stage/"
            tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
            ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          done
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mc-php-archives
          path: dist/
          if-no-files-found: error

  # Each Linux archive is GRADED on a Linux runner of its own architecture
  # before anything is published: unpacked, and then the same fixture gate the
  # macOS job ran, against a php 8.5 on that host (tests/linux.sh). `publish`
  # needs both, so an archive that does not run is never released.
  grade-linux:
    name: Grade (${{ matrix.slug }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { slug: linux-arm64,  arch: aarch64, runner: ubuntu-24.04-arm }
          - { slug: linux-x86_64, arch: x86_64,  runner: ubuntu-24.04 }
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          name: mc-php-archives
          path: dist

      - name: Unpack the one this host is for, checksum first
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -eu
          name="mc-php-$VERSION-$SLUG"
          ( cd dist && sha256sum -c "$name.tar.gz.sha256" )
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p build
          cp "$RUNNER_TEMP/$name/mc-php" "build/mc-php-$SLUG"
          chmod +x "build/mc-php-$SLUG"

      - name: It loads, it compiles, and the fixtures agree with php
        run: sh tests/linux.sh ${{ matrix.arch }}

  publish:
    name: Publish the release
    needs: [build, grade-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Download every producer's artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: The body is the tag's own annotation
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/body.md"
          [ -s "$RUNNER_TEMP/body.md" ] || echo "mc-php $TAG" > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "---"
            echo
            echo "macOS arm64, linux/aarch64 and linux/x86_64. Each archive was RUN"
            echo "on a host of its own architecture before this release was published:"
            echo "the macOS one by \`tests/run.sh\`, the two Linux ones by"
            echo "\`tests/linux.sh\`, which compiles every fixture and compares it with"
            echo "php 8.5 on that host. No Windows archive: see the README's *Install*."
          } >> "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -l dist
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/body.md" \
            dist/* || \
          gh release upload "$TAG" dist/* --clobber
