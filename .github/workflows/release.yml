# Release -- build the compiler for the hosts CI can produce, and publish it.
#
# Started by autotag.yml with the tag it just pushed, or by hand from the
# Actions tab. The shape is mc's release.yml: the tag's annotation becomes the
# release body, every archive carries a .sha256 beside it, and `publish` needs
# every producer so a half-built release is never published.
#
# FIVE archives, and each one is a target that has been RUN. macOS arm64 is
# built and graded on the runner; the two Linux compilers are CROSS-BUILT on
# the same macOS runner -- mc writes a dynamic ELF64 itself, no linker and no
# sysroot -- and then each is graded on a Linux runner of its own architecture,
# by tests/linux.sh, against a php 8.5 of that host. A row is here because
# something ran it, never because it linked.
#
# The two Windows archives are NOT cross-built: mc-php does not cross-compile
# across operating systems, so each is built ON a Windows runner of its own
# architecture by that runner's mc.exe (the object + lld-link road,
# docs/plan.md § 5), graded there by tests/windows.sh, and packaged there.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, e.g. v0.1.0"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  MC_VERSION: "1.3.0"
  PHP_VERSION: "8.5"

jobs:
  build:
    name: Build (macos/arm64 + the two Linux cross-builds)
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0     # the annotation is the release body

      - name: The version
        id: ver
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$TAG" in v*) : ;; *) echo "::error::$TAG is not a v* tag"; exit 1 ;; esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install mc ${{ env.MC_VERSION }}
        run: |
          set -eu
          asset="mc-$MC_VERSION-macos-arm64.tar.gz"
          base="https://github.com/minicompiler/mc/releases/download/v$MC_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/$asset"        "$base/$asset"
          curl -fsSL -o "$RUNNER_TEMP/$asset.sha256" "$base/$asset.sha256"
          ( cd "$RUNNER_TEMP" && shasum -a 256 -c "$asset.sha256" )
          mkdir -p "$RUNNER_TEMP/mc"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/mc" --strip-components=1
          echo "$RUNNER_TEMP/mc" >> "$GITHUB_PATH"

      - name: Install PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Build
        run: |
          mc --version
          mc build
          ls -l build/mc-php

      - name: Install mc's library tree where any mc-php can find it
        run: |
          set -eu
          # To BUILD mc-php, not to run it. src/mc-php.mc includes <float> and
          # the two float machines, and since mc's M52 those are LIBRARY names
          # resolved out of a tree beside `mc`, not out of its blob.
          #
          # It used to be needed to RUN it as well: lib/php_rt.mc opened with
          # `#include <sys>`, so every program mc-php compiled needed the tree
          # too. Since the hosts branch the runtime declares its own system
          # calls (lib/rt_host_*.mc) and a released mc-php needs nothing
          # installed beside it -- which is what makes a one-binary archive
          # honest on every host.
          #
          # $HOME/.mc/libs and not beside the binary: tests/fixtures.sh takes a
          # SNAPSHOT of the compiler into a temporary directory before it
          # grades anything, and a snapshot has no tree beside it. The HOME
          # root is the one that survives being copied, which is why it is the
          # one `mc install` writes.
          #
          # The tree comes out of the tarball already downloaded and verified,
          # so this needs no network and no registry.
          mkdir -p "$HOME/.mc/libs"
          cp -R "$RUNNER_TEMP/mc/lib/mc" "$HOME/.mc/libs/mc"
          ls -d "$HOME/.mc/libs/mc/"*

      # A release is not published on a compiler that has not been graded.
      # This is the same tests/run.sh CI runs on every pull request.
      - name: The fast gates
        run: sh tests/run.sh

      - name: Package (macos/arm64)
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          name="mc-php-$VERSION-macos-arm64"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"
          cp build/mc-php "$stage/mc-php"
          cp README.md LICENSE "$stage/" 2>/dev/null || cp README.md "$stage/"
          # What a user needs beside the binary, and nothing else: the runtime
          # is INSIDE it (#embed), so there is no lib/ to ship.
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -l dist

      - name: Cross-build the two Linux compilers
        run: |
          set -eu
          # No linker and no sysroot: `os = "linux"` has a direct-executable
          # backend (mc's M42), so `mc build` writes the ELF itself. The entry
          # names the host layer -- `#include <mc/host>` would bake this
          # runner's macOS one into a Linux binary, which is what the branch
          # started from (`_NSGetEnviron: symbol not found`).
          mc build src --config src/mc-php.linux-aarch64.toml
          mc build src --config src/mc-php.linux-x86_64.toml
          file build/mc-php-linux-arm64 build/mc-php-linux-x86_64

      - name: Package
        id: pkg2
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          for pair in "linux-arm64:build/mc-php-linux-arm64" "linux-x86_64:build/mc-php-linux-x86_64"; do
            slug=${pair%%:*}; bin=${pair#*:}
            name="mc-php-$VERSION-$slug"
            stage="$RUNNER_TEMP/$name"
            mkdir -p "$stage"
            cp "$bin" "$stage/mc-php"
            cp README.md LICENSE "$stage/"
            tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
            ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          done
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mc-php-archives
          path: dist/
          if-no-files-found: error

  # Each Linux archive is GRADED on a Linux runner of its own architecture
  # before anything is published: unpacked, and then the same fixture gate the
  # macOS job ran, against a php 8.5 on that host (tests/linux.sh). `publish`
  # needs both, so an archive that does not run is never released.
  grade-linux:
    name: Grade (${{ matrix.slug }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { slug: linux-arm64,  arch: aarch64, runner: ubuntu-24.04-arm }
          - { slug: linux-x86_64, arch: x86_64,  runner: ubuntu-24.04 }
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          name: mc-php-archives
          path: dist

      - name: Unpack the one this host is for, checksum first
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -eu
          name="mc-php-$VERSION-$SLUG"
          ( cd dist && sha256sum -c "$name.tar.gz.sha256" )
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p build
          cp "$RUNNER_TEMP/$name/mc-php" "build/mc-php-$SLUG"
          chmod +x "build/mc-php-$SLUG"

      - name: It loads, it compiles, and the fixtures agree with php
        run: sh tests/linux.sh ${{ matrix.arch }}

  # Built, graded and packaged ON Windows -- the same steps as ci.yml's
  # windows job, then the archive. `publish` needs both, so a Windows archive
  # that did not pass the fixture gate and the extension gate on its own host
  # is never released.
  build-windows:
    name: Build and grade (windows-${{ matrix.nick }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64,  nick: x86_64, runner: windows-latest }
          - { arch: aarch64, nick: arm64,  runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    env:
      MSYS2_ARG_CONV_EXCL: "*"
      LLVM_VERSION: "20.1.8"
    steps:
      - name: Never translate line endings
        run: git config --global core.autocrlf false

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install mc ${{ env.MC_VERSION }} (the Windows build)
        run: |
          set -eu
          asset="mc-$MC_VERSION-windows-${{ matrix.nick }}.tar.gz"
          base="https://github.com/minicompiler/mc/releases/download/v$MC_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$asset"        "$base/$asset"
          curl -fsSL -o "$asset.sha256" "$base/$asset.sha256"
          sha256sum -c "$asset.sha256"
          mkdir -p mc
          tar -xzf "$asset" -C mc --strip-components=1
          cygpath -w "$RUNNER_TEMP/mc" >> "$GITHUB_PATH"

      - name: lld-link
        run: |
          set -eu
          if command -v lld-link >/dev/null 2>&1; then :
          elif [ -x "/c/Program Files/LLVM/bin/lld-link.exe" ]; then
            printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          else
            base="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION"
            # the runner's own CPU: a tarball first, then the NSIS installer
            case "${{ matrix.arch }}" in
              aarch64) tgz=aarch64-pc-windows-msvc; nsis=woa64 ;;
              *)       tgz=x86_64-pc-windows-msvc;  nsis=win64 ;;
            esac
            mkdir -p "$RUNNER_TEMP/llvm"
            if curl -fSL -o "$RUNNER_TEMP/llvm.tar.xz" "$base/clang+llvm-$LLVM_VERSION-$tgz.tar.xz"; then
              tar -xf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP/llvm" --strip-components=1
            else
              curl -fSL -o "$RUNNER_TEMP/llvm.exe" "$base/LLVM-$LLVM_VERSION-$nsis.exe"
              7z x -o"$RUNNER_TEMP/llvm" "$RUNNER_TEMP/llvm.exe" > /dev/null
            fi
            cygpath -w "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"
          fi

      - name: Install PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Build
        run: |
          set -eu
          mc --version
          sh tests/winsys.sh ${{ matrix.arch }}
          [ "${{ matrix.arch }}" = x86_64 ] || sh tests/winsys.sh x86_64
          mc build src --config src/mc-php.windows-${{ matrix.arch }}.toml
          build/mc-php-windows-${{ matrix.arch }}.exe --host

      - name: It compiles, the fixtures agree, and the extension loads
        run: |
          TMPDIR=$(cygpath -m "$RUNNER_TEMP")
          export TMPDIR
          sh tests/windows.sh ${{ matrix.arch }}

      - name: Package (windows-${{ matrix.nick }})
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          name="mc-php-$VERSION-windows-${{ matrix.nick }}"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" dist
          cp build/mc-php-windows-${{ matrix.arch }}.exe "$stage/mc-php.exe"
          # the two import libraries a PROGRAM links against on the object
          # road (windows/arm64 has no other road), so the archive alone is
          # enough there: lists of kernel32.dll's and ucrtbase.dll's names,
          # written by tests/winsys.sh from src/win/*.def
          cp build/win-${{ matrix.arch }}/kernel32.lib build/win-${{ matrix.arch }}/ucrtbase.lib "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mc-php-windows-${{ matrix.nick }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, grade-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Download every producer's artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: The body is the tag's own annotation
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/body.md"
          [ -s "$RUNNER_TEMP/body.md" ] || echo "mc-php $TAG" > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "---"
            echo
            echo "macOS arm64, linux/aarch64, linux/x86_64, windows/x86_64 and"
            echo "windows/arm64. Each archive was RUN on a host of its own architecture"
            echo "before this release was published: the macOS one by \`tests/run.sh\`,"
            echo "the two Linux ones by \`tests/linux.sh\` and the two Windows ones --"
            echo "built on those Windows runners, not cross-built -- by"
            echo "\`tests/windows.sh\`, each compiling every fixture and comparing it"
            echo "with php 8.5 on that host."
          } >> "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -l dist
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/body.md" \
            dist/* || \
          gh release upload "$TAG" dist/* --clobber
