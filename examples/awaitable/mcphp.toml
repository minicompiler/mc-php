# awaitable -- awaitable.src.php, the PHP form of awaitable.mc, described by a file.
#
#     mc-php build examples/awaitable --config examples/awaitable/mcphp.toml
#
# This is the build the example is WORKING TOWARD. It compiles; tests/examples.sh
# loads what it writes and records how many of check.expect's lines check.php
# already prints through it (README.md lists what the bodies still wait for).
# Until every line does, the example is the hand-written awaitable.mc, which
# tests/examples.sh compiles with plain mc and links itself. On Windows the
# build stops at #[Extern]'s named refusal, which the gate pins.

[project]
entry = "awaitable.src.php"
out = "build/awaitable.so"
kind = "exe"
opt = 1

[linker]
cmd = "ld"
args = ["-bundle", "-undefined", "dynamic_lookup",
        "-arch", "arm64", "-platform_version", "macos", "13.0", "13.0",
        "-syslibroot", "{sdk}", "-lSystem",
        "-o", "{out}", "{obj}"]

[extension]
name = "awaitable"
version = "0.1.0"

[php]
api = 20250925
build_id = "API20250925,NTS"
thread_safety = false
debug = false
