# awaitable -- awaitable.src.php, a ZTS PHP extension, described by a file.
#
#     mc-php build examples/awaitable --config examples/awaitable/mcphp.toml
#
# The extension is the compiled awaitable.src.php: no C, no phpize. It is a ZTS
# module -- parallel() runs php callables on threads, which a thread-safe php
# runs as php requests of their own (docs/threads.md, step 3b) -- so it loads
# only into a thread-safe php. macOS ships an NTS php, so tests/examples.sh does
# not run it natively here; it builds the LINUX module and runs check.php in
# Docker (php:8.5-zts-alpine). This file is the macOS/Mach-O build for a
# thread-safe macOS php; mcphp.linux.toml and mcphp.windows.toml are the others.

[project]
entry = "awaitable.src.php"
out = "build/awaitable.so"
kind = "exe"
opt = 1

[linker]
cmd = "ld"
args = ["-bundle", "-undefined", "dynamic_lookup",
        "-arch", "arm64", "-platform_version", "macos", "13.0", "13.0",
        "-syslibroot", "{sdk}", "-lSystem",
        "-o", "{out}", "{obj}"]

[extension]
name = "awaitable"
version = "0.1.0"

[php]
api = 20250925
build_id = "API20250925,NTS"
thread_safety = "zts"
debug = false
