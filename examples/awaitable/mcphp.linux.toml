# awaitable -- awaitable.src.php, the PHP form of awaitable.mc. The LINUX linker line.
#
# Everything but [linker] is examples/awaitable/mcphp.toml's: mc's [linker] is
# flat, so the second host is a second file (examples/decimal/mcphp.linux.toml
# says why).
#
#     mc-php build examples/awaitable --config examples/awaitable/mcphp.linux.toml

[project]
entry = "awaitable.src.php"
out = "build/awaitable.so"
kind = "exe"
# mc's optimizer (-O: its register allocator, its branch peephole and loop
# hoisting), on for every extension this repository builds: an extension is
# called from a php that is already warm, so the generated code is the whole
# cost. examples/decimal measured 2.79 ms without it and 1.64 ms with it
# (docs/plan.md § 7 item 1).
opt = 1

# The escape hatch, and on Linux it is the only road: mc writes an ELF
# EXECUTABLE by itself and php loads a shared object.
#
# `-Bsymbolic` is not optional. mc takes the address of its own functions with
# adrp/add (and lea on x86-64), and in a shared object a default-visibility
# symbol is preemptible, so without it the link is refused outright.
[linker]
cmd = "ld.lld"
args = ["-shared", "-Bsymbolic", "-o", "{out}", "{obj}"]

[extension]
name = "awaitable"
version = "0.1.0"

# Read off the target php with `php -i`, and nothing else about it is
# consulted. Stating them rather than pointing at a binary is what makes a
# cross-build need no php on the machine; it is also what makes this file go
# stale when the target php's minor moves, which tests/ext.sh checks on every
# run and names.
#
#     PHP API             => 20250925        api
#     PHP Extension Build => API20250925,NTS build_id
#     Thread Safety       => disabled        thread_safety = false
#     Debug Build         => no              debug = false
[php]
api = 20250925
build_id = "API20250925,NTS"
thread_safety = false
debug = false
# unchecked reads, as C (docs/semantics.md): see mcphp.toml
checked_reads = false
