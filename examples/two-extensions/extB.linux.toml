# two-extensions, B -- extB.php compiled into build/extB.so; the Linux linker line.
#
#     mc-php build examples/two-extensions --config examples/two-extensions/extB.linux.toml
#
# One file per extension and per host, exactly as examples/decimal has one per
# host: mc's [linker] is flat, and one project file builds one module.
# examples/decimal/mcphp.linux.toml says what each key is.

[project]
entry = "extB.php"
out = "build/extB.so"
kind = "exe"
opt = 1

[linker]
cmd = "ld.lld"
args = ["-shared", "-Bsymbolic", "-o", "{out}", "{obj}"]

[extension]
name = "extB"
version = "0.1.0"

[php]
api = 20250925
build_id = "API20250925,NTS"
thread_safety = "nts"
debug = false
checked_reads = false
