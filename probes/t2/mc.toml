# T2 road (b): the [linker] road, ld with -export_dynamic.
[project]
entry = "host.mc"
out   = "build/host-ld"
kind  = "exe"

[target]
os   = "macos"
arch = "aarch64"

[linker]
cmd  = "ld"
args = ["-arch", "arm64", "-platform_version", "macos", "13.0", "13.0",
        "-syslibroot", "{sdk}", "-lSystem", "-export_dynamic",
        "-o", "{out}", "{obj}"]
