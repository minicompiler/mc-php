# The mc project that builds this compiler.
#
#     mc build          ->  build/mc-php
#
# There is no [compiler] section and there should not be: mc's [compiler] is
# for a project that ASSEMBLES a taught compiler and then spawns it. This
# repository's entry IS the taught compiler, so it is an ordinary program.
#
# No [target]: with none, mc uses the host pair (mc's M37).
#
# This entry is the NATIVE build on a host whose mc layer declares everything
# mc-php calls, which is macOS. It is not Linux -- src/mc-php.mc says why, with
# the measurement -- and there the entry is the one for your architecture:
#
#     mc build src --config src/mc-php.linux-aarch64.toml
#     mc build src --config src/mc-php.linux-x86_64.toml
#
# Those two are the cross-build road from any host AND the native road on
# Linux; a [target] equal to the host is an ordinary build.
#
# On Windows the build is NATIVE and only native -- an object linked by
# lld-link next to the three files tests/winsys.sh writes (docs/plan.md § 5
# says why it is not mc's one-step PE):
#
#     sh tests/winsys.sh x86_64 && mc build src --config src/mc-php.windows-x86_64.toml
#     sh tests/winsys.sh aarch64 && mc build src --config src/mc-php.windows-aarch64.toml

[package]
name = "mc-php"
version = "0.1.0"
# p_skip_to and syntax_expr("$") -- probes/t4 measured that PHP's byte stream
# cannot be owned without them, and they landed in 1.1.0.
mc = "1.1.0"

# An SPDX identifier, for anyone reading the manifest. There are no
# [package].files and no [[permission]] rows: those exist for mc's package
# manager, and mc-php is distributed as a GitHub release instead.
licence = "MIT"

[project]
name = "mc-php"
entry = "src/mc-php.mc"
out = "build/mc-php"
kind = "exe"
